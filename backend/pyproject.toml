# 后端静态检查配置（ruff）。
# 只开「几乎不会误报」的规则集，避免一次性引入上千条历史告警把 CI 变红。
[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [
    ".venv",
    "__pycache__",
    "alembic/versions",  # 迁移脚本由 alembic 模板生成，格式不强制
]

[tool.ruff.lint]
# E/F 是 pycodestyle 与 pyflakes 的基础错误（未定义名、重复导入、语法级问题）
# I 是 import 排序；其余规则（命名、复杂度等）暂不启用
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E501",  # 行长由 formatter 之外的风格自行掌握，中文注释容易超
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811"]  # 测试里常有意保留的导入与重复定义

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
